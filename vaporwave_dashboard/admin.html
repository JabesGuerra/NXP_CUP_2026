<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>NXP_CUP // CONTROL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --vw-cyan: #00f0ff;
      --vw-cyan-light: #80d0ff;
      --vw-yellow: #ffea00;
    }
    body { background-color: #050d0a; color: #00ffaa; font-family: 'Share Tech Mono', monospace; }
    .btn-vapor { background-color: #003b22; color: #00ffaa; border: 1px solid #00ffaa; }
    .btn-vapor:hover { background-color: #00ffaa; color: #050d0a; }
    .input-vapor { background-color: #000 !important; color: var(--vw-cyan) !important; border-color: #00f0ff55 !important; font-size: 0.95rem; }
    .text-cyan { color: var(--vw-cyan) !important; }
    .text-cyan-light { color: var(--vw-cyan-light) !important; }
    .text-yellow { color: var(--vw-yellow) !important; }
  </style>
</head>
<body class="p-3">

  <h2 class="font-arcade text-center text-success mb-3 display-5">
    <i class="fa-solid fa-sliders me-2"></i>PANEL DE CONTROL NXP_CUP
  </h2>

  <div class="mb-3 p-3 border border-success rounded bg-dark">
    <label class="form-label text-cyan fw-bold fs-6 mb-1">IP LIVE STREAM (CÁMARA DEL VEHÍCULO)</label>
    <div class="input-group input-group-lg">
      <input type="text" id="admin-ip" value="http://172.16.155.120:8650" class="form-control input-vapor fw-bold">
      <button id="btn-send-ip" class="btn btn-vapor fs-5">CAMBIAR IP</button>
    </div>
  </div>

  <div class="mb-3 p-3 border border-success rounded bg-dark d-flex justify-content-between align-items-center">
    <span class="fs-5 text-cyan-light fw-bold">ESTADO TRANSMISIÓN [LIVE]:</span>
    <div class="form-check form-switch mb-0">
      <input class="form-check-input fs-3" type="checkbox" id="switch-live" checked style="cursor: pointer;">
      <label class="form-check-label text-white fs-5 ms-2" for="switch-live">MOSTRAR "EN VIVO"</label>
    </div>
  </div>

  <div class="mb-3 p-3 border border-success rounded bg-dark">
    <label class="form-label text-cyan fw-bold fs-5 mb-2"><i class="fa-solid fa-calculator me-2"></i>CONFIGURACIÓN DE PUNTUACIÓN GLOBAL</label>
    <div class="row g-2">
      <div class="col-md-2 col-6">
        <small class="text-white d-block">Pts / Vuelta:</small>
        <input type="number" id="pts-lap" value="150" class="form-control input-vapor fw-bold">
      </div>
      <div class="col-md-2 col-6">
        <small class="text-warning d-block">Pts / Gold Coin:</small>
        <input type="number" id="pts-gold" value="30" class="form-control input-vapor fw-bold">
      </div>
      <div class="col-md-2 col-6">
        <small class="text-danger d-block">Pts / Red Coin:</small>
        <input type="number" id="pts-red" value="-10" class="form-control input-vapor fw-bold">
      </div>
      <div class="col-md-2 col-6">
        <small class="text-info d-block">Pts / Blue Coin:</small>
        <input type="number" id="pts-blue" value="10" class="form-control input-vapor fw-bold">
      </div>
      <div class="col-md-2 col-6">
        <small class="text-warning d-block">Pts / Vuelta Incompleta:</small>
        <input type="number" id="pts-inc-lap" value="75" class="form-control input-vapor fw-bold">
      </div>
      <div class="col-md-2 col-6">
        <small class="text-cyan d-block">Umbral FL (s):</small>
        <input type="number" step="0.1" id="threshold-fl" value="12.0" class="form-control input-vapor fw-bold">
      </div>
      <div class="col-md-12 col-12 mt-2">
        <small class="text-cyan d-block">Bono por Umbral FL:</small>
        <input type="number" id="bonus-fl" value="50" class="form-control input-vapor fw-bold">
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="font-arcade text-success fs-2 mb-0">PARTICIPANTES, TIEMPOS Y PUNTOS</h4>
    <button id="btn-add-driver" class="btn btn-vapor fs-5 px-3">
      <i class="fa-solid fa-plus me-1"></i> AÑADIR PILOTO
    </button>
  </div>

  <div id="admin-list" class="d-flex flex-column gap-2 mb-3"></div>

  <div class="d-grid gap-2">
    <button id="btn-sort-broadcast" class="btn btn-vapor font-arcade fs-2 py-2">
      <i class="fa-solid fa-bolt me-2"></i>CALCULAR PUNTOS, AUTOSORT Y TRANSMITIR
    </button>
  </div>

  <script>
    const channel = new BroadcastChannel('f1_vaporwave_channel');
    
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        channel.postMessage({ type: 'TOGGLE_FULLSCREEN' });
      }
    });

    let config = JSON.parse(localStorage.getItem('nxp_config')) || {
      ptsLap: 150, ptsGold: 30, ptsRed: -10, ptsBlue: 10, ptsIncLap: 75, thresholdFL: 12.0, bonusFL: 50, ip: "http://172.16.155.120:8650"
    };

    let state = JSON.parse(localStorage.getItem('nxp_state')) || [
      { pos: 1, name: "VER", driver: "Max Verstappen", team: "Red Bull", gap: "LÍDER", time: "1:28.140", laps: 3, goldCoins: 2, redCoins: 0, blueCoins: 1, incLaps: 0, totalPoints: 0 },
      { pos: 2, name: "NOR", driver: "Lando Norris", team: "McLaren", gap: "+1.240s", time: "1:29.380", laps: 3, goldCoins: 1, redCoins: 1, blueCoins: 2, incLaps: 0, totalPoints: 0 },
      { pos: 3, name: "LEC", driver: "Charles Leclerc", team: "Ferrari", gap: "+2.015s", time: "1:30.155", laps: 2, goldCoins: 3, redCoins: 0, blueCoins: 0, incLaps: 1, totalPoints: 0 }
    ];

    function saveContext() {
      localStorage.setItem('nxp_state', JSON.stringify(state));
      localStorage.setItem('nxp_config', JSON.stringify(config));
    }

    function initConfigInputs() {
      document.getElementById('pts-lap').value = config.ptsLap;
      document.getElementById('pts-gold').value = config.ptsGold;
      document.getElementById('pts-red').value = config.ptsRed;
      document.getElementById('pts-blue').value = config.ptsBlue;
      document.getElementById('pts-inc-lap').value = config.ptsIncLap;
      document.getElementById('threshold-fl').value = config.thresholdFL;
      document.getElementById('bonus-fl').value = config.bonusFL;
      document.getElementById('admin-ip').value = config.ip;
    }

    function renderAdmin() {
      const container = document.getElementById('admin-list');
      container.innerHTML = state.map((item, idx) => `
        <div class="bg-dark p-2 border border-secondary rounded flex-column gap-2">
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-success text-black font-monospace fs-5">P${idx + 1}</span>
            <input type="text" value="${item.name}" placeholder="TAG" maxlength="3" 
                   data-idx="${idx}" data-field="name" class="input-change form-control input-vapor text-uppercase fw-bold" style="width: 65px;">
            <input type="text" value="${item.driver}" placeholder="Piloto" 
                   data-idx="${idx}" data-field="driver" class="input-change form-control input-vapor flex-grow-1 fw-bold">
            <span class="text-yellow font-monospace fw-bold fs-5 px-2">${item.totalPoints || 0} pts</span>
            <button onclick="removeDriver(${idx})" class="btn btn-outline-danger"><i class="fa-solid fa-trash fs-5"></i></button>
          </div>
          
          <div class="d-flex align-items-center gap-2">
            <input type="text" value="${item.team}" placeholder="Equipo" 
                   data-idx="${idx}" data-field="team" class="input-change form-control input-vapor flex-grow-1 text-cyan-light">
            <input type="text" value="${item.time}" placeholder="1:28.140" 
                   data-idx="${idx}" data-field="time" class="input-change form-control input-vapor text-cyan-light fw-bold" style="width: 110px;">
            <button onclick="move(${idx}, -1)" class="btn btn-outline-success"><i class="fa-solid fa-arrow-up fs-5"></i></button>
            <button onclick="move(${idx}, 1)" class="btn btn-outline-success"><i class="fa-solid fa-arrow-down fs-5"></i></button>
          </div>

          <div class="d-flex align-items-center gap-2 bg-black p-2 rounded border border-success border-opacity-25 flex-wrap">
            <small class="text-cyan fw-bold">CANTIDADES:</small>
            <div class="d-flex align-items-center gap-1">
              <small class="text-white">Vueltas:</small>
              <input type="number" value="${item.laps || 0}" data-idx="${idx}" data-field="laps" class="input-change form-control input-vapor p-1 text-center" style="width: 50px;">
            </div>
            <div class="d-flex align-items-center gap-1">
              <small class="text-warning">V.Inc:</small>
              <input type="number" value="${item.incLaps || 0}" data-idx="${idx}" data-field="incLaps" class="input-change form-control input-vapor p-1 text-center" style="width: 50px;">
            </div>
            <div class="d-flex align-items-center gap-1">
              <small class="text-warning">Gold:</small>
              <input type="number" value="${item.goldCoins || 0}" data-idx="${idx}" data-field="goldCoins" class="input-change form-control input-vapor p-1 text-center" style="width: 50px;">
            </div>
            <div class="d-flex align-items-center gap-1">
              <small class="text-danger">Red:</small>
              <input type="number" value="${item.redCoins || 0}" data-idx="${idx}" data-field="redCoins" class="input-change form-control input-vapor p-1 text-center" style="width: 50px;">
            </div>
            <div class="d-flex align-items-center gap-1">
              <small class="text-info">Blue:</small>
              <input type="number" value="${item.blueCoins || 0}" data-idx="${idx}" data-field="blueCoins" class="input-change form-control input-vapor p-1 text-center" style="width: 50px;">
            </div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.input-change').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = e.target.getAttribute('data-idx');
          const field = e.target.getAttribute('data-field');
          state[idx][field] = e.target.type === 'number' ? parseFloat(e.target.value) || 0 : e.target.value;
          saveContext();
        });
      });
    }

    function parseTimeToSeconds(timeStr) {
      if (!timeStr) return Infinity;
      const cleanStr = timeStr.trim();
      if (cleanStr.includes(':')) {
        const parts = cleanStr.split(':');
        return ((parseFloat(parts[0]) || 0) * 60) + (parseFloat(parts[1]) || 0);
      }
      return parseFloat(cleanStr) || Infinity;
    }

    function autoSortAndCalculatePoints() {
      config.ptsLap = parseFloat(document.getElementById('pts-lap').value) || 0;
      config.ptsGold = parseFloat(document.getElementById('pts-gold').value) || 0;
      config.ptsRed = parseFloat(document.getElementById('pts-red').value) || 0;
      config.ptsBlue = parseFloat(document.getElementById('pts-blue').value) || 0;
      config.ptsIncLap = parseFloat(document.getElementById('pts-inc-lap').value) || 0;
      config.thresholdFL = parseFloat(document.getElementById('threshold-fl').value) || Infinity;
      config.bonusFL = parseFloat(document.getElementById('bonus-fl').value) || 0;

      state.forEach((item) => {
        let points = (item.laps * config.ptsLap) +
                      ((item.incLaps || 0) * config.ptsIncLap) +
                      (item.goldCoins * config.ptsGold) +
                      (item.redCoins * config.ptsRed) +
                      ((item.blueCoins || 0) * config.ptsBlue);
        
        const timeSec = parseTimeToSeconds(item.time);
        if (timeSec <= config.thresholdFL) {
          points += config.bonusFL;
        }

        item.totalPoints = points;
      });

      state.sort((a, b) => b.totalPoints - a.totalPoints);
      const leaderTimeSec = parseTimeToSeconds(state[0]?.time);

      state.forEach((item, index) => {
        item.pos = index + 1;
        if (index === 0) {
          item.gap = "LÍDER";
        } else {
          const currentTimeSec = parseTimeToSeconds(item.time);
          const diff = currentTimeSec - leaderTimeSec;
          item.gap = (currentTimeSec === Infinity || isNaN(currentTimeSec)) ? "N/A" : `+${diff.toFixed(3)}s`;
        }
      });

      saveContext();
      renderAdmin();
    }

    document.getElementById('btn-add-driver').addEventListener('click', () => {
      state.push({ pos: state.length + 1, name: "PIL", driver: "Nuevo Piloto", team: "Escudería", gap: "+0.000s", time: "1:35.000", laps: 0, goldCoins: 0, redCoins: 0, blueCoins: 0, incLaps: 0, totalPoints: 0 });
      saveContext();
      renderAdmin();
    });

    function removeDriver(index) {
      state.splice(index, 1);
      state.forEach((item, i) => item.pos = i + 1);
      saveContext();
      renderAdmin();
    }

    function move(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= state.length) return;
      const temp = state[index];
      state[index] = state[newIndex];
      state[newIndex] = temp;
      state.forEach((item, i) => item.pos = i + 1);
      saveContext();
      renderAdmin();
    }

    document.getElementById('switch-live').addEventListener('change', (e) => {
      channel.postMessage({ type: 'TOGGLE_LIVE_STATUS', payload: e.target.checked });
    });

    document.getElementById('btn-send-ip').addEventListener('click', () => {
      config.ip = document.getElementById('admin-ip').value;
      saveContext();
      channel.postMessage({ type: 'UPDATE_SERVER_URL', payload: config.ip });
    });

    document.getElementById('btn-sort-broadcast').addEventListener('click', () => {
      autoSortAndCalculatePoints();
      channel.postMessage({ type: 'UPDATE_LEADERBOARD', payload: state });
    });

    initConfigInputs();
    renderAdmin();
  </script>
</body>
</html>
