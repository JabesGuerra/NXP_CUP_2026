<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXP_CUP // REGLAS DE LA CARRERA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --vw-green: #00ffaa;
      --vw-green-glow: #00ffaa88;
      --vw-cyan: #00f0ff;
      --vw-cyan-light: #80d0ff;
      --vw-dark-green: #003b22;
      --vw-bg: #050d0a;
      --vw-card-bg: #0c1813;
      --vw-yellow: #ffea00;
    }

    body {
      background-color: var(--vw-bg);
      color: var(--vw-green);
      font-family: 'Share Tech Mono', monospace;
      background-image: 
        linear-gradient(rgba(0, 255, 170, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 170, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      min-height: 100vh;
    }

    .font-arcade { font-family: 'VT323', monospace; }
    .glow-text { text-shadow: 0 0 16px var(--vw-green-glow); }
    .text-cyan { color: var(--vw-cyan) !important; }
    .text-yellow { color: var(--vw-yellow) !important; text-shadow: 0 0 8px rgba(255, 234, 0, 0.6); }

    .btn-vapor {
      background-color: var(--vw-dark-green);
      color: var(--vw-green);
      border: 1px solid var(--vw-green);
    }
    .btn-vapor:hover { background-color: var(--vw-green); color: var(--vw-bg); }

    .rules-card {
      background: var(--vw-card-bg);
      border: 2px solid var(--vw-green);
      box-shadow: 0 0 20px var(--vw-green-glow);
      transform: skewX(-4deg);
    }
    .rules-card-inner { transform: skewX(4deg); }

    .coin-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
    }

    .bullet-point {
      width: 12px;
      height: 12px;
      background-color: var(--vw-cyan);
      box-shadow: 0 0 8px var(--vw-cyan);
      display: inline-block;
      transform: rotate(45deg);
    }
  </style>
</head>
<body class="d-flex flex-column justify-content-center align-items-center p-4">

  <div class="container max-w-lg">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <a href="/index.html" class="btn btn-vapor font-arcade fs-4 px-3 py-1">
        <i class="fa-solid fa-arrow-left me-2"></i>VOLVER AL DASHBOARD
      </a>
    </div>

    <div class="rules-card p-4 p-md-5 rounded">
      <div class="rules-card-inner">
        <!-- Título -->
        <h1 class="display-1 font-arcade text-center text-success glow-text mb-4">
          <i class="fa-solid fa-scroll me-3"></i>REGLAS
        </h1>

        <!-- Subtítulo / Regla principal -->
        <div class="fs-2 text-white border-bottom border-success border-opacity-50 pb-3 mb-4 text-center">
          Habrá un máximo de <span class="text-yellow fw-bold">5 vueltas</span>.
        </div>

        <!-- Sección Puntajes -->
        <div class="mb-3">
          <div class="d-flex align-items-center gap-3 mb-3">
            <span class="bullet-point"></span>
            <h2 class="font-arcade text-cyan fs-1 mb-0">PUNTAJES:</h2>
          </div>

          <div class="d-flex flex-column gap-3 fs-3 ps-4">
            <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-2">
              <span class="text-white"><i class="fa-solid fa-check-circle text-success me-3"></i>Vuelta correcta:</span>
              <span class="text-yellow font-monospace fw-bold">+150 pts</span>
            </div>

            <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-2">
              <span class="text-white"><i class="fa-solid fa-arrow-rotate-left text-warning me-3"></i>Vuelta con giro incorrecto:</span>
              <span class="text-yellow font-monospace fw-bold">+75 pts</span>
            </div>

            <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-2">
              <div class="d-flex align-items-center gap-3">
                <img src="assets/coins/moneda_amarilla.png" alt="Amarilla" class="coin-img" onerror="this.src='https://via.placeholder.com/40/ffea00/000000?text=GOLD'">
                <span class="text-white">Moneda Dorada:</span>
              </div>
              <span class="text-yellow font-monospace fw-bold">+30 pts</span>
            </div>

            <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-2">
              <div class="d-flex align-items-center gap-3">
                <img src="assets/coins/moneda_azul.png" alt="Azul" class="coin-img" onerror="this.src='https://via.placeholder.com/40/00f0ff/000000?text=BLUE'">
                <span class="text-white">Moneda Azul:</span>
              </div>
              <span class="text-yellow font-monospace fw-bold">+10 pts</span>
            </div>

            <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-2">
              <div class="d-flex align-items-center gap-3">
                <img src="assets/coins/moneda_roja.png" alt="Roja" class="coin-img" onerror="this.src='https://via.placeholder.com/40/ff0055/000000?text=RED'">
                <span class="text-white">Moneda Roja:</span>
              </div>
              <span class="text-danger font-monospace fw-bold">-10 pts</span>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <span class="text-white"><i class="fa-solid fa-stopwatch text-cyan me-3"></i>Tiempo &lt; 12seg :</span>
              <span class="text-yellow font-monospace fw-bold">+50 pts</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
